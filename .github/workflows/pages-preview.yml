name: Deploy Fromm Viewer Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fromm-viewer-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy independent preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned public Fromm Viewer baseline
        uses: actions/checkout@v4
        with:
          repository: fffdsaw/fromm-viewer
          ref: e8c57b137d43e8d16e43ba2cb11db6a5f71636bc
          persist-credentials: false
          path: upstream

      - name: Checkout experimental overlay
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: preview

      - name: Assemble isolated public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp upstream/index.html upstream/*.js upstream/*.css upstream/*.webmanifest upstream/.nojekyll _site/
          cp -a upstream/assets upstream/vendor _site/
          if test -d preview/overrides; then
            cp -a preview/overrides/. _site/
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          html = Path("_site/index.html")
          source = html.read_text(encoding="utf-8")
          old = "<title>Fromm Viewer</title>"
          assert old in source, "Expected title missing from baseline"
          source = source.replace(old, "<title>Fromm Viewer · 실험용</title>", 1)
          charset = '<meta charset="utf-8" />'
          assert charset in source, "Expected UTF-8 head marker missing"
          from os import environ
          version = environ.get("GITHUB_SHA", "development")[:12]
          source = source.replace(charset, charset + chr(10) + '<script src="preview-storage.js?v=' + version + '"></script>', 1)
          needle = "</body>"
          assert needle in source, "Expected HTML body close missing"
          source = source.replace(needle, '<script src="preview-chat.js?v=' + version + '"></script>' + chr(10) + needle, 1)
          html.write_text(source, encoding="utf-8")
          manifest_path = Path("_site/manifest.webmanifest")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "Fromm Viewer 실험용"
          manifest["short_name"] = "Fromm 실험용"
          manifest["id"] = "/fromm-viewer-preview/"
          manifest["start_url"] = "/fromm-viewer-preview/"
          manifest["scope"] = "/fromm-viewer-preview/"
          core_path = Path("_site/web-conversation-core.js")
          core = core_path.read_text(encoding="utf-8")
          assert "name='fromm-conversations-v1'" in core, "Conversation store schema moved"
          core_path.write_text(core.replace("name='fromm-conversations-v1'", "name='fromm-preview-conversations-v1'", 1), encoding="utf-8")
          conversation_path = Path("_site/web-conversation.js")
          conversation = conversation_path.read_text(encoding="utf-8")
          assert "event.key===epochKey(c.storageAccount,c.host)" in conversation
          assert "event.key===storageKey(c.storageAccount)" in conversation
          conversation = conversation.replace("event.key===epochKey(c.storageAccount,c.host)", "event.key==='fromm.preview.v1::'+epochKey(c.storageAccount,c.host)", 1)
          conversation = conversation.replace("event.key===storageKey(c.storageAccount)", "event.key==='fromm.preview.v1::'+storageKey(c.storageAccount)", 1)
          old_counter = "changes.filter(m=>!oldKeys.has(messageStableKey(m))).length"
          assert old_counter in conversation, "Expected new-message counter missing"
          conversation = conversation.replace(old_counter, "changes.filter(m=>isArtist(m)&&!oldKeys.has(messageStableKey(m))).length", 1)
          conversation_path.write_text(conversation, encoding="utf-8")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          test -f _site/index.html
          test -f _site/web-conversation.js
          test -f _site/conversation.css
          test -f _site/vendor/firebase/conversation-10.12.2.js
          test -f _site/assets/glowme/favicon-32.png
          node --check _site/web-conversation.js
          node --check _site/web-conversation-core.js
          node --check _site/preview-chat.js
          node --check _site/preview-storage.js
          grep -q "fromm-preview-conversations-v1" _site/web-conversation-core.js
          grep -q "preview-chat.js?v=" _site/index.html


      - name: Install isolated browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Test preview chat on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node preview/test/preview-chat.browser.cjs
          cp _site/index.html _site/preview-chat.js upstream/
          NODE_PATH="$PWD/preview/node_modules" node upstream/test/conversation-send-focus.browser.cjs
          NODE_PATH="$PWD/preview/node_modules" node upstream/test/reply-anchor-context.browser.cjs
          NODE_PATH="$PWD/preview/node_modules" node upstream/test/reply-start-top.browser.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
