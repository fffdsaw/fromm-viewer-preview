name: Deploy Fromm Viewer Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fromm-viewer-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: "Build and deploy PR #121 test site"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout fixed PR #121 source
        uses: actions/checkout@v4
        with:
          repository: fffdsaw/fromm-viewer
          ref: 5609ede9f5d8c503244d5eba0e0d9e4fe76e13f1
          persist-credentials: false
          path: upstream

      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: preview

      - name: Assemble PR-only site with isolated browser storage
        shell: bash
        run: |
          set -euo pipefail
          python3 preview/scripts/build-pr121-preview.py upstream _site "$GITHUB_SHA"

          test -f _site/index.html
          test -f _site/preview-storage.js
          test -f _site/pr121-preview-banner.js
          node --check _site/web-conversation.js
          node --check _site/web-conversation-core.js
          node --check _site/web-pwa.js
          node --check _site/sw.js
          node --check _site/preview-storage.js
          node --check _site/pr121-preview-banner.js
          python3 -m json.tool _site/manifest.webmanifest >/dev/null
          python3 -m json.tool _site/pr121-build.json >/dev/null
          grep -q "fromm-preview-conversations-v1" _site/web-conversation-core.js
          grep -q "fromm-viewer-preview/sw.js" _site/web-pwa.js
          grep -q "scope: '/fromm-viewer-preview/'" _site/web-pwa.js
          grep -q "fromm-viewer-preview-public-art-" _site/sw.js
          grep -q "5609ede9f5d8c503244d5eba0e0d9e4fe76e13f1" _site/pr121-build.json
          ! grep -q "preview-chat.js" _site/index.html

      - name: Install synthetic browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Test preview storage boundaries and v1 to v2 migration
        shell: bash
        run: PR121_SITE_ROOT="$PWD/_site" node preview/test/pr121-storage-isolation.browser.cjs

      - name: Test PR #121 unit and browser regressions on assembled site
        shell: bash
        run: |
          set -euo pipefail
          # Existing upstream tests serve their checkout root. Populate that temporary
          # runner checkout with the exact assembled deployment before exercising it.
          cp -a _site/. upstream/
          node --test upstream/test/conversation.test.cjs upstream/test/unread.test.cjs
          export NODE_PATH="$PWD/preview/node_modules"
          node upstream/test/conversation-state.browser.cjs
          node upstream/test/conversation-cache-restore.browser.cjs
          node upstream/test/conversation-cache-conflicts.browser.cjs
          node upstream/test/conversation-storage-recovery.browser.cjs
          node upstream/test/chat-history-progressive.browser.cjs
          node upstream/test/chat-history-scale.browser.cjs
          node upstream/test/reply-anchor-context.browser.cjs
          node upstream/test/reply-start-top.browser.cjs
          node upstream/test/my-replies.browser.cjs
          node upstream/test/search-calendar-panel.browser.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PR #121 test artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy PR #121 test site
        id: deployment
        uses: actions/deploy-pages@v4
