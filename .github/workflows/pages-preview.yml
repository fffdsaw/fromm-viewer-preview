name: Deploy Fromm Viewer Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fromm-viewer-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy isolated PR #123 integration preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: https://fffdsaw.github.io/fromm-viewer-preview/
    steps:
      - name: Checkout verified PR #123 source (never production main)
        uses: actions/checkout@v4
        with:
          repository: fffdsaw/fromm-viewer
          ref: 1c7bb5019180d37549abb6b12cfc09c729de1dc5
          # The Node regression tests compare against historical b78f2b1.
          # A shallow checkout omits that ancestor and fails git rev-parse.
          fetch-depth: 0
          persist-credentials: false
          path: upstream

      - name: Checkout independent preview scripts and storage wrapper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: preview

      - name: Assemble PR #123 preview with isolated browser state
        shell: bash
        run: |
          set -euo pipefail
          python3 preview/scripts/build-pr123-preview.py upstream _site "$GITHUB_SHA"
          python3 -m json.tool _site/pr123-build.json >/dev/null
          python3 -m json.tool _site/manifest.webmanifest >/dev/null
          grep -q '1c7bb5019180d37549abb6b12cfc09c729de1dc5' _site/pr123-build.json
          grep -q 'fromm-preview-conversations-v1' _site/web-conversation-core.js
          grep -q 'fromm-viewer-preview/' _site/web-pwa.js
          grep -q 'fromm-viewer-preview-public-art-' _site/sw.js
          grep -q 'preview-storage.js?v=' _site/index.html
          grep -q 'pr123-preview-banner.js?v=' _site/index.html
          for asset in compact-player.css settings-panel.css themes.css web-compact-player.js web-themes.js web-glass.js web-glass-controls.js web-glass-settings.js web-chat-audio.js pr123-legacy-media.css pr123-gallery-audio-controls.js; do
            test -f "_site/$asset"
          done
          for js in _site/web-conversation.js _site/web-conversation-core.js _site/web-compact-player.js _site/web-themes.js _site/web-glass-controls.js _site/web-glass.js _site/web-pwa.js _site/sw.js _site/preview-storage.js _site/pr123-preview-banner.js _site/pr123-gallery-audio-controls.js; do
            node --check "$js"
          done

      - name: Install isolated Playwright browser tooling
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Test preview storage isolation, migration, worker, new assets
        shell: bash
        run: |
          set -euo pipefail
          PR123_SITE_ROOT="$PWD/_site" node preview/test/pr123-storage-isolation.browser.cjs

      - name: Run PR #123 regressions against pinned original checkout
        shell: bash
        run: |
          set -euo pipefail
          node --test upstream/test/*.test.cjs
          export NODE_PATH="$PWD/preview/node_modules"
          node upstream/test/settings-themes.browser.cjs
          node upstream/test/uiux-cards-sidebar.browser.cjs
          node upstream/test/conversation-refresh-cache.browser.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy isolated PR #123 preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published preview version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          import os
          url = 'https://fffdsaw.github.io/fromm-viewer-preview/pr123-build.json'
          wanted = '1c7bb5019180d37549abb6b12cfc09c729de1dc5'
          last = None
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url + '?check=' + str(time.time()), headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.load(response)
                  if data.get('sourceCommit') == wanted and data.get('previewWorkflowCommit') == os.environ['GITHUB_SHA']:
                      print('Published PR #123 preview matches pinned source and workflow SHA')
                      break
                  last = 'unexpected published revision: ' + repr(data)
              except Exception as exc:
                  last = str(exc)
              time.sleep(5)
          else:
              raise SystemExit('Preview deploy could not be confirmed: ' + str(last))
          PY
