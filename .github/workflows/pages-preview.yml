name: Deploy Fromm Viewer Preview

on:
  push:
    branches:
      - main
      - feature/preview-main-copy-artist-20261119
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fromm-viewer-preview-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify latest-source Artist preview (deploy only preview main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://fffdsaw.github.io/fromm-viewer-preview/
    steps:
      - name: Checkout pinned current operating source READ ONLY
        uses: actions/checkout@v4
        with:
          repository: fffdsaw/fromm-viewer
          ref: a21ced8d34bab7b4d3d7662babb106cbd144cad3
          fetch-depth: 0
          persist-credentials: false
          path: upstream

      - name: Checkout independent experimental repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: preview

      - name: Assemble isolated experimental copy
        shell: bash
        run: |
          set -euo pipefail
          python3 preview/scripts/build-pr123-preview.py upstream _site "$GITHUB_SHA"
          python3 -m json.tool _site/pr123-build.json >/dev/null
          python3 -m json.tool _site/manifest.webmanifest >/dev/null
          grep -q 'a21ced8d34bab7b4d3d7662babb106cbd144cad3' _site/pr123-build.json
          grep -q 'fromm-preview-conversations-v1' _site/web-conversation-core.js
          grep -q 'fromm-viewer-preview/' _site/web-pwa.js
          grep -q 'fromm-viewer-preview-public-art-' _site/sw.js
          grep -q 'preview-storage.js?v=' _site/index.html
          grep -q 'preview-artist.js?v=' _site/index.html
          for file in web-glass.js web-morph-menu.js web-channel-photos.js preview-artist.js preview-artist-feed.js preview-nickname.js preview-artist-banner.js preview-storage.js web-conversation.js web-conversation-core.js web-pwa.js sw.js; do
            test -f "_site/$file"
            node --check "_site/$file"
          done

      - name: Verify Artist feed source parsing without any live API requests
        shell: bash
        run: |
          set -euo pipefail
          node --test preview/test/preview-artist-feed.test.cjs

      - name: Test preview fan nickname formatting and original data preservation
        shell: bash
        run: |
          set -euo pipefail
          node --test preview/test/preview-nickname.test.cjs

      - name: Install isolated browser tooling
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Test preview-only Artist and storage isolation
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_SITE_ROOT="$PWD/_site" node preview/test/artist-preview.browser.cjs

      - name: Run operating-source unit regressions against unchanged source
        shell: bash
        run: |
          set -euo pipefail
          node --test upstream/test/*.test.cjs

      - name: Configure Pages (preview main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload preview artifact (preview main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy preview only (never operating site)
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published preview commit and pinned source
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request, os
          url='https://fffdsaw.github.io/fromm-viewer-preview/pr123-build.json'
          for attempt in range(15):
              try:
                  request=urllib.request.Request(url+'?check='+str(time.time()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response: data=json.load(response)
                  if data.get('sourceCommit')=='a21ced8d34bab7b4d3d7662babb106cbd144cad3' and data.get('previewWorkflowCommit')==os.environ['GITHUB_SHA']:
                      print('Published isolated Artist preview matches commit and copied operating source')
                      break
              except Exception as exc:
                  print('Preview verification retry:',type(exc).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Could not verify the published preview revision')
          PY
